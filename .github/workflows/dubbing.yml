name: Dubbing WebUI
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['apps/dubbing_web/**', 'frontend/**', 'tests/dubbing/**', 'docker/**', 'compose*.yaml', 'scripts/**', 'requirements-dubbing.lock.txt', '.github/workflows/dubbing.yml']
  pull_request:
    paths: ['apps/dubbing_web/**', 'frontend/**', 'tests/dubbing/**', 'docker/**', 'compose*.yaml', 'scripts/**', 'requirements-dubbing.lock.txt', '.github/workflows/dubbing.yml']
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: dubbing-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dubbing.lock.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg mkvtoolnix libsndfile1
      - if: runner.os == 'Windows'
        run: python scripts/setup_tools.py
      - run: python -m pytest tests/dubbing -q
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run build
  docker-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.yaml config --quiet
      - run: docker build --platform ${{ matrix.platform }} -f docker/Dockerfile.dubbing -t dubbing:test .
      - name: Verify runtime UID and GID configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker run --rm dubbing:test id -u)" = 0
          test "$(docker run --rm -e UID=1234 -e GID=2345 dubbing:test id -u)" = 1234
          test "$(docker run --rm -e UID=1234 -e GID=2345 dubbing:test id -g)" = 2345
          test "$(docker run --rm -e UID=1234 dubbing:test id -g)" = 1000
          test "$(docker run --rm -e GID=2345 dubbing:test id -u)" = 1000
          test "$(docker run --rm --user 1234:2345 dubbing:test id -u)" = 1234
          if docker run --rm -e UID=invalid dubbing:test id; then exit 1; fi
      - name: Verify root and custom-user HTTP startup with bind mounts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/media"
          docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/media:/fixtures" --entrypoint ffmpeg dubbing:test -v error -f lavfi -i color=s=64x64:d=1 -c:v libx264 /fixtures/source.mp4
          python -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"media","phụ đề.srt").write_text("1\n00:00:00,000 --> 00:00:00,500\nXin chào\n",encoding="utf-8")'
          chmod -R a+rX "$RUNNER_TEMP/media"
          for identity in '0:0' '1234:2345'; do
            data="$RUNNER_TEMP/data-${identity/:/-}"
            sudo mkdir -p "$data"
            sudo chown "$identity" "$data"
            sudo chmod 700 "$data"
            options=()
            if [ "$identity" != '0:0' ]; then options=(-e UID=1234 -e GID=2345); fi
            docker run -d --name dubbing-smoke -p 127.0.0.1:7861:7861 "${options[@]}" --mount "type=bind,source=$data,target=/data" --mount "type=bind,source=$RUNNER_TEMP/media,target=/media,readonly" -e APP_MEDIA_ROOT=/media dubbing:test
            trap 'docker logs dubbing-smoke; docker rm -f dubbing-smoke' EXIT
            rm -f /tmp/health.json
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:7861/api/health > /tmp/health.json; then break; fi
              sleep 2
            done
            curl --fail --silent http://127.0.0.1:7861/ > /tmp/index.html
            python -c 'import json; h=json.load(open("/tmp/health.json")); assert all(h["tools"].values()), h'
            python -c 'import json,urllib.request; r=urllib.request.Request("http://127.0.0.1:7861/api/media/import",data=json.dumps({"video":"source.mp4","srt":"phụ đề.srt"}).encode(),headers={"Content-Type":"application/json"}); p=json.load(urllib.request.urlopen(r)); assert p["cues"][0]["text"]=="Xin chào"'
            test "$(sudo stat -c '%u:%g' "$data/tmp")" = "$identity"
            docker rm -f dubbing-smoke
            trap - EXIT
          done
  publish:
    needs: docker-smoke
    if: github.repository == 'NgoMinhToan/vienue-dubbing' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/ngominhtoan/vienue-dubbing
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (github.event_name == 'release' && !github.event.release.prerelease) }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          file: docker/Dockerfile.dubbing
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published digest and platforms
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/ngominhtoan/vienue-dubbing@$IMAGE_DIGEST"
          docker buildx imagetools inspect "$image"
          docker buildx imagetools inspect --raw "$image" | jq -e '
            [.manifests[].platform | "\(.os)/\(.architecture)"]
            | (index("linux/amd64") != null) and (index("linux/arm64") != null)
          '
