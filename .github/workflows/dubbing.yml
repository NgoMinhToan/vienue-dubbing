name: Dubbing WebUI
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['apps/dubbing_web/**', 'frontend/**', 'tests/dubbing/**', 'docker/**', 'scripts/**', 'requirements-dubbing.lock.txt', '.github/workflows/dubbing.yml']
  pull_request:
    paths: ['apps/dubbing_web/**', 'frontend/**', 'tests/dubbing/**', 'docker/**', 'scripts/**', 'requirements-dubbing.lock.txt', '.github/workflows/dubbing.yml']
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: dubbing-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dubbing.lock.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg mkvtoolnix libsndfile1
      - if: runner.os == 'Windows'
        run: python scripts/setup_tools.py
      - run: python -m pytest tests/dubbing -q
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run build
  docker-smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.dubbing -t dubbing:test .
      - name: Verify non-root container and HTTP startup
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name dubbing-smoke -p 127.0.0.1:7861:7861 dubbing:test
          trap 'docker logs dubbing-smoke; docker rm -f dubbing-smoke' EXIT
          test "$(docker exec dubbing-smoke id -u)" != 0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7861/api/health > /tmp/health.json; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:7861/ > /tmp/index.html
          python -c 'import json; h=json.load(open("/tmp/health.json")); assert all(h["tools"].values()), h'
  publish:
    needs: docker-smoke
    if: github.repository == 'NgoMinhToan/vienue-dubbing' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/ngominhtoan/vienue-dubbing
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          file: docker/Dockerfile.dubbing
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: docker buildx imagetools inspect "ghcr.io/ngominhtoan/vienue-dubbing@$IMAGE_DIGEST"
